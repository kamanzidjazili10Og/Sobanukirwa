services:
  - type: web
    name: sobanukirwa
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: Sobanukirwa@123
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sobanukirwa-db
          property: connectionString

databases:
  - name: sobanukirwa-db
    plan: free
    databaseName: sobanukirwa
